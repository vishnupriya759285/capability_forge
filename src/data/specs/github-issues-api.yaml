openapi: 3.0.3
info:
  title: GitHub Repository Issues & Discussions API
  description: Real-world developer API specification for managing repo issues, assigning reviewers, and publishing triage comments.
  version: 2022-11-28
servers:
  - url: https://api.github.com
    description: Official GitHub Public REST API
paths:
  /repos/{owner}/{repo}:
    get:
      summary: Get Repository Metadata
      operationId: get_repo
      tags: [Repositories]
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Repository details

  /repos/{owner}/{repo}/issues:
    get:
      summary: List Repository Issues
      operationId: list_issues
      tags: [Issues]
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
            enum: [open, closed, all]
      responses:
        '200':
          description: List of issues
    post:
      summary: Create an Issue
      operationId: create_issue
      tags: [Issues]
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                body:
                  type: string
      responses:
        '201':
          description: Issue created

  /repos/{owner}/{repo}/issues/{issue_number}:
    get:
      summary: Get an Issue
      operationId: get_issue
      tags: [Issues]
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: issue_number
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Issue details
    patch:
      summary: Update Issue State or Labels
      operationId: update_issue
      tags: [Issues]
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: issue_number
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Issue updated

  /repos/{owner}/{repo}/issues/{issue_number}/comments:
    get:
      summary: List Issue Comments
      operationId: list_issue_comments
      tags: [Comments]
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: issue_number
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: List of comments
    post:
      summary: Post a Comment to an Issue
      operationId: create_issue_comment
      tags: [Comments]
      parameters:
        - name: owner
          in: path
          required: true
          schema:
            type: string
        - name: repo
          in: path
          required: true
          schema:
            type: string
        - name: issue_number
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
      responses:
        '201':
          description: Comment created
